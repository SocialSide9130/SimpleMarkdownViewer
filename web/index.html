<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Simple Markdown Viewer</title>
<link rel="stylesheet" href="shell.css">
</head>
<body>
<header id="toolbar">
  <button id="btnOpen" type="button" title="ファイルを開く (Ctrl+O)">
    <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M1.75 2h4.1l1.5 1.5h6.9c.41 0 .75.34.75.75V6H3.2L1 12.6V2.75c0-.41.34-.75.75-.75Zm1.9 5h11.6l-2.2 6.4a.75.75 0 0 1-.7.6H1.6Z"/></svg>
    開く
  </button>
  <label class="toggle" title="スクロール同期のオン/オフ (Ctrl+L)">
    <input type="checkbox" id="chkSync">
    <span class="track"><span class="thumb"></span></span>
    スクロール同期
  </label>
  <span class="spacer"></span>
  <span id="message" role="status"></span>
  <label class="select" title="表示テーマ">
    テーマ
    <select id="selTheme">
      <option value="auto">OSに合わせる</option>
      <option value="light">ライト</option>
      <option value="dark">ダーク</option>
    </select>
  </label>
</header>

<main id="panes"></main>

<div id="empty">
  <div class="empty-box">
    <svg viewBox="0 0 48 48" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round" d="M12 4h17l9 9v29a2 2 0 0 1-2 2H12a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2ZM29 4v9h9"/><text x="24" y="35" text-anchor="middle" font-size="11" font-weight="700" font-family="Segoe UI, sans-serif">MD</text></svg>
    <p>Markdown ファイルをここにドラッグ＆ドロップ</p>
    <button id="btnOpenEmpty" type="button">ファイルを開く…</button>
    <p class="hint">複数ファイルを同時に開くと左右に並べて表示します</p>
  </div>
</div>

<script src="shell.js"></script>
</body>
</html>
